<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found | Ahmad Ali</title>
<style>
:root{--bg:#070b18;--bg2:#0c1226;--txt:#eaf0ff;--muted:#9fb0d0;--brand:#4f7cff;--brand2:#8b5cf6;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;
 font-family:"Segoe UI",Roboto,system-ui,Arial,sans-serif;color:var(--txt);
 background:radial-gradient(800px 500px at 30% 20%,rgba(79,124,255,.25),transparent 60%),
            radial-gradient(700px 500px at 75% 75%,rgba(139,92,246,.22),transparent 60%),
            linear-gradient(180deg,var(--bg),var(--bg2))}
.n{font-size:clamp(5rem,20vw,9rem);font-weight:900;line-height:1;letter-spacing:-.04em;
 background:linear-gradient(100deg,var(--brand),var(--brand2),#22d3ee);-webkit-background-clip:text;
 background-clip:text;-webkit-text-fill-color:transparent}
h1{font-size:clamp(1.3rem,4vw,2rem);font-weight:800;margin:6px 0 10px}
p{color:var(--muted);max-width:44ch;margin:0 auto 26px}
a{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:14px;font-weight:700;
 text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));
 box-shadow:0 16px 34px -14px var(--brand);transition:.28s}
a:hover{transform:translateY(-3px)}
img{width:74px;height:74px;border-radius:50%;object-fit:cover;object-position:center top;
 border:3px solid rgba(255,255,255,.15);margin-bottom:18px}
</style>
</head>
<body>
  <div>
    <img src="images/ahmad.jpg" alt="Ahmad Ali" />
    <div class="n">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link you followed is broken or the page has moved. Let's get you back home.</p>
    <a href="/">Back to my portfolio</a>
  </div>
</body>
</html>
